databases:
  - name: sokoprice-db
    plan: free
    databaseName: sokoprice
    user: sokoprice

services:
  - type: web
    name: sokoprice-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sokoprice-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sokoprice-phi.vercel.app
      - key: PYTHON_VERSION
        value: "3.13.1"
